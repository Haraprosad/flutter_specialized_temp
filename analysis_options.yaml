include: package:very_good_analysis/analysis_options.6.0.0.yaml

analyzer:
  exclude:
    # Generated code — never lint these
    - '**/*.g.dart'
    - '**/*.freezed.dart'
    - 'lib/core/di/injection.config.dart'
    - 'lib/l10n/**'
    - 'lib/generated/**'
  errors:
    # Annotation libraries emit this on generated files; safe to silence.
    invalid_annotation_target: ignore

linter:
  rules:
    # ── Rules disabled project-wide ───────────────────────────────────────────

    # Docs are required only in the domain layer. Enable per-file via:
    #   // ignore_for_file: public_member_api_docs
    # on non-domain files, or flip this to true and add ignores elsewhere.
    public_member_api_docs: false

    # Project line-length standard is 120 chars (configured in .editorconfig).
    lines_longer_than_80_chars: false

    # Generated code uses double quotes; keeping this off avoids false positives
    # from barrel imports that re-export generated symbols.
    prefer_single_quotes: false

    # ── Rules enforced on top of very_good_analysis defaults ─────────────────
    always_use_package_imports: true
    avoid_print: true
    avoid_dynamic_calls: true
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    require_trailing_commas: true
    unnecessary_await_in_return: true
    use_super_parameters: true
    use_named_constants: true
